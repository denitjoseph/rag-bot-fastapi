apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-bot-ingress
  namespace: rag-bot
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:208805232757:certificate/98c61b26-37f3-430b-9584-e311da301c11
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /_stcore/health
spec:
  ingressClassName: alb
  rules:
    - host: app.denitjoseph.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
