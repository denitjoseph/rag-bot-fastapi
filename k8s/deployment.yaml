apiVersion: v1
kind: Namespace
metadata:
  name: rag-bot

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rag-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 208805232757.dkr.ecr.ap-south-1.amazonaws.com/rag-bot-backend:4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: rag-backend-secrets
          volumeMounts:
            - name: temporary-uploads
              mountPath: /app/temp
            - name: temporary-vector-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: temporary-uploads
          emptyDir: {}
        - name: temporary-vector-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rag-bot
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rag-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 208805232757.dkr.ecr.ap-south-1.amazonaws.com/rag-bot-frontend:4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_URL
              value: http://backend:8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rag-bot
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8501